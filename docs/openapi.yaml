          type: string
          description: 콘서트 제목
          example: "누가죄인인가"
        concertDate:
          type: string
          format: date
          description: 콘서트 날짜
          example: "2025-09-05"
        seatId:
          type: string
          description: 좌석 ID
          example: "1"

    ReservationResponse:
      type: object
      required:
        - reservationId
        - concertInfo
        - seatInfo
        - holdExpiresAt
        - status
      properties:
        reservationId:
          type: string
          description: 예약 ID
          example: "RHIDEONBUSH1268512345"
        concertInfo:
          $ref: '#/components/schemas/ConcertInfo'
        seatInfo:
          $ref: '#/components/schemas/SeatInfo'
        holdExpiresAt:
          type: string
          description: 임시 배정 만료 시간
          example: "2025-09-06T10:05:00"
        status:
          type: string
          description: 예약 상태
          example: "HOLD"

    ConcertInfo:
      type: object
      required:
        - date
        - title
        - ticketPrice
      properties:
        date:
          type: string
          description: 콘서트 날짜
          example: "2025-09-07"
        title:
          type: string
          description: 콘서트 제목
          example: "우리집강아지길동이"
        ticketPrice:
          type: number
          format: decimal
          description: 티켓 가격
          example: 110000.00

    SeatInfo:
      type: object
      required:
        - seatId
        - seatNumber
      properties:
        seatId:
          type: string
          description: 좌석 ID
          example: "1"
        seatNumber:
          type: integer
          description: 좌석 번호
          example: 1

    BalanceChargeRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: decimal
          minimum: 1
          description: 충전할 금액
          example: 49900.00

    BalanceChargeResponse:
      type: object
      required:
        - userId
        - previousBalance
        - chargeAmount
        - newBalance
        - transactionId
        - chargedAt
      properties:
        userId:
          type: string
          description: 사용자 ID
          example: "HH12345"
        previousBalance:
          type: number
          format: decimal
          description: 충전 전 잔액
          example: 100000.00
        chargeAmount:
          type: number
          format: decimal
          description: 충전 금액
          example: 50000.00
        newBalance:
          type: number
          format: decimal
          description: 충전 후 잔액
          example: 150000.00
        transactionId:
          type: string
          description: 거래 ID
          example: "THH12345-102975097"
        chargedAt:
          type: string
          description: 충전 시간
          example: "2025-09-04T10:00:00"

    BalanceResponse:
      type: object
      required:
        - userId
        - currentBalance
        - lastUpdatedAt
        - recentTransactions
      properties:
        userId:
          type: string
          description: 사용자 ID
          example: "HIDEONBUSH"
        currentBalance:
          type: number
          format: decimal
          description: 현재 잔액
          example: 999990.00
        lastUpdatedAt:
          type: string
          description: 마지막 업데이트 시간
          example: "2025-09-01T10:00:00"
        recentTransactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionInfo'
          description: 최근 거래 내역

    TransactionInfo:
      type: object
      required:
        - transactionId
        - type
        - amount
        - balanceAfter
        - createdAt
      properties:
        transactionId:
          type: string
          description: 거래 ID
          example: "THIDE-12512345"
        type:
          type: string
          description: 거래 타입
          example: "CHARGE"
        amount:
          type: number
          format: decimal
          description: 거래 금액
          example: 50000.00
        balanceAfter:
          type: number
          format: decimal
          description: 거래 후 잔액
          example: 150000.00
        createdAt:
          type: string
          description: 거래 생성 시간
          example: "2025-09-04T10:00:00"

    PaymentResponse:
      type: object
      required:
        - paymentId
        - reservationInfo
        - paymentInfo
        - userInfo
      properties:
        paymentId:
          type: string
          description: 결제 ID
          example: "PHIDE-12512509712"
        reservationInfo:
          $ref: '#/components/schemas/ReservationInfo'
        paymentInfo:
          $ref: '#/components/schemas/PaymentInfo'
        userInfo:
          $ref: '#/components/schemas/UserInfo'

    ReservationInfo:
      type: object
      required:
        - reservationId
        - concertDate
        - concertTitle
        - seatNumber
      properties:
        reservationId:
          type: string
          description: 예약 ID
          example: "RHIDE-103251790257"
        concertDate:
          type: string
          description: 콘서트 날짜
          example: "2025-19-07"
        concertTitle:
          type: string
          description: 콘서트 제목
          example: "우주개라이카"
        seatNumber:
          type: integer
          description: 좌석 번호
          example: 1

    PaymentInfo:
      type: object
      required:
        - amount
        - status
        - paidAt
      properties:
        amount:
          type: number
          format: decimal
          description: 결제 금액
          example: 100000.00
        status:
          type: string
          description: 결제 상태
          example: "COMPLETED"
        paidAt:
          type: string
          description: 결제 시간
          example: "2025-09-06T10:03:00"

    UserInfo:
      type: object
      required:
        - userId
        - balanceBefore
        - balanceAfter
      properties:
        userId:
          type: string
          description: 사용자 ID
          example: "HIDEONBUSH"
        balanceBefore:
          type: number
          format: decimal
          description: 결제 전 잔액
          example: 150000.00
        balanceAfter:
          type: number
          format: decimal
          description: 결제 후 잔액
          example: 50000.00

    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
        - timestamp
      properties:
        errorCode:
          type: string
          description: 오류 코드
          example: "INVALID_TOKEN"
        message:
          type: string
          description: 오류 메시지
          example: "유효하지 않은 토큰입니다."
        timestamp:
          type: string
          format: date-time
          description: 오류 발생 시간
          example: "2025-09-06T10:00:00"
        details:
          type: object
          description: 추가 오류 정보
          example:
            field: "tokenId"
            value: "invalid-token"

  securitySchemes:
    QueueTokenAuth:
      type: apiKey
      in: query
      name: tokenId
      description: 대기열 토큰을 통한 인증


