            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    TokenResponse:
      type: object
      required:
        - tokenId
        - queueStatus
      properties:
        tokenId:
          type: string
          description: 발급된 토큰 ID
          example: "TOKEN+UUID12983789"
        queueStatus:
          $ref: '#/components/schemas/QueueStatusResponse'

    QueueStatusResponse:
      type: object
      required:
        - queuePosition
        - totalWaitingUsers
        - remainingTimeInSeconds
        - isActive
      properties:
        queuePosition:
          type: integer
          description: 현재 대기 순서
          example: 77
        totalWaitingUsers:
          type: integer
          description: 총 대기자 수
          example: 88
        remainingTimeInSeconds:
          type: integer
          description: 토큰 남은 유효 시간 (초)
          example: 299
        isActive:
          type: boolean
          description: 활성화 상태 여부
          example: false

    ConcertResponse:
      type: object
      required:
        - concertId
        - concertName
        - concertPeriodStart
        - concertPeriodEnd
        - isActive
        - venues
      properties:
        concertId:
          type: string
          description: 콘서트 ID
          example: "RAIKASPACEDOG"
        concertName:
          type: string
          description: 콘서트 이름
          example: "우주개라이카"
        concertPeriodStart:
          type: string
          format: date
          description: 콘서트 기간 시작일
          example: "2025-09-07"
        concertPeriodEnd:
          type: string
          format: date
          description: 콘서트 기간 종료일
          example: "2025-09-10"
        isActive:
          type: boolean
          description: 예약 가능 여부
          example: true
        venues:
          type: array
          items:
            $ref: '#/components/schemas/VenueInfo'
          description: 해당 콘서트가 열리는 공연장 목록

    VenueInfo:
      type: object
      required:
        - venueId
        - venueName
        - venueCity
        - venueAddress
        - venueCapacity
        - performances
      properties:
        venueId:
          type: string
          description: 공연장 고유 식별자
          example: "VENUE-001"
        venueName:
          type: string
          description: 공연장 이름
          example: "서울 올림픽 경기장"
        venueCity:
          type: string
          description: 공연장 도시
          example: "서울"
        venueAddress:
          type: string
          description: 공연장 주소
          example: "서울 송파구 올림픽로 424"
        venueCapacity:
          type: integer
          description: 공연장 수용 인원
          example: 10000
        performances:
          type: array
          items:
            $ref: '#/components/schemas/PerformanceInfo'
          description: 해당 공연장에서 열리는 공연 목록

    PerformanceInfo:
      type: object
      required:
        - performanceId
        - performanceDate
        - performanceTime
        - ticketPrice
        - availableSeats
      properties:
        performanceId:
          type: string
          description: 공연 고유 식별자
          example: "PERF-001"
        performanceDate:
          type: string
          format: date
          description: 공연 날짜
          example: "2025-09-07"
        performanceTime:
          type: string
          description: 공연 시간
          example: "19:00"
        ticketPrice:
          type: number
          format: decimal
          description: 티켓 가격
          example: 89000.00
        availableSeats:
          type: integer
          description: 예약 가능한 좌석 수
          example: 45

    ConcertSeatResponse:
      type: object
      required:
        - concertInfo
        - availableSeats
        - totalSeats
        - availableCount
      properties:
        concertInfo:
          $ref: '#/components/schemas/ConcertResponse'
        availableSeats:
          type: array
          items:
            $ref: '#/components/schemas/SeatResponse'
          description: 좌석 상세 정보 목록
        totalSeats:
          type: integer
          description: 총 좌석 수
          example: 50
        availableCount:
          type: integer
          description: 예약 가능한 좌석 수
          example: 45

    SeatResponse:
      type: object
      required:
        - seatId
        - seatNumber
        - status
      properties:
        seatId:
          type: string
          description: 좌석 ID
          example: "1"
        seatNumber:
          type: string
          description: 좌석 번호
          example: "1"
        status:
          type: string
          enum: [AVAILABLE, HOLD, SOLD, EXPIRED]
          description: 좌석 상태
          example: "AVAILABLE"
      example:
        - seatId: "1"
          seatNumber: "1"
          status: "AVAILABLE"
        - seatId: "2"
          seatNumber: "2"
          status: "AVAILABLE"
        - seatId: "3"
          seatNumber: "3"
          status: "HOLD"
        - seatId: "4"
          seatNumber: "4"
          status: "SOLD"
        - seatId: "5"
          seatNumber: "5"
          status: "AVAILABLE"
        - seatId: "6"
          seatNumber: "6"
          status: "AVAILABLE"
        - seatId: "7"
          seatNumber: "7"
          status: "AVAILABLE"
        - seatId: "8"
          seatNumber: "8"
          status: "HOLD"
        - seatId: "9"
          seatNumber: "9"
          status: "AVAILABLE"
        - seatId: "10"
          seatNumber: "10"
