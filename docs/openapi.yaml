    BalanceChargeRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: decimal
          minimum: 1
          description: 충전할 금액
          example: 49900.00

    BalanceChargeResponse:
      type: object
      required:
        - userId
        - previousBalance
        - chargeAmount
        - newBalance
        - transactionId
        - chargedAt
      properties:
        userId:
          type: string
          description: 사용자 ID
          example: "HH12345"
        previousBalance:
          type: number
          format: decimal
          description: 충전 전 잔액
          example: 100000.00
        chargeAmount:
          type: number
          format: decimal
          description: 충전 금액
          example: 50000.00
        newBalance:
          type: number
          format: decimal
          description: 충전 후 잔액
          example: 150000.00
        transactionId:
          type: string
          description: 거래 ID
          example: "THH12345-102975097"
        chargedAt:
          type: string
          description: 충전 시간
          example: "2025-09-04T10:00:00"

    BalanceResponse:
      type: object
      required:
        - userId
        - currentBalance
        - lastUpdatedAt
        - recentTransactions
      properties:
        userId:
          type: string
          description: 사용자 ID
          example: "HIDEONBUSH"
        currentBalance:
          type: number
          format: decimal
          description: 현재 잔액
          example: 999990.00
        lastUpdatedAt:
          type: string
          description: 마지막 업데이트 시간
          example: "2025-09-01T10:00:00"
        recentTransactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionInfo'
          description: 최근 거래 내역

    TransactionInfo:
      type: object
      required:
        - transactionId
        - type
        - amount
        - balanceAfter
        - createdAt
      properties:
        transactionId:
          type: string
          description: 거래 ID
          example: "THIDE-12512345"
        type:
          type: string
          description: 거래 타입
          example: "CHARGE"
        amount:
          type: number
          format: decimal
          description: 거래 금액
          example: 50000.00
        balanceAfter:
          type: number
          format: decimal
          description: 거래 후 잔액
          example: 150000.00
        createdAt:
          type: string
          description: 거래 생성 시간
          example: "2025-09-04T10:00:00"

    PaymentResponse:
      type: object
      required:
        - paymentId
        - reservationInfo
        - paymentInfo
        - userInfo
      properties:
        paymentId:
          type: string
          description: 결제 ID
          example: "PHIDE-12512509712"
        reservationInfo:
          $ref: '#/components/schemas/ReservationInfo'
        paymentInfo:
          $ref: '#/components/schemas/PaymentInfo'
        userInfo:
          $ref: '#/components/schemas/UserInfo'

    ReservationInfo:
      type: object
      required:
        - reservationId
        - concertDate
        - concertTitle
        - venueName
        - venueCity
        - seatNumber
      properties:
        reservationId:
          type: string
          description: 예약 ID
          example: "RHIDE-103251790257"
        concertDate:
          type: string
          description: 콘서트 날짜
          example: "2025-09-07"
        concertTitle:
          type: string
          description: 콘서트 제목
          example: "우주개라이카"
        venueName:
          type: string
          description: 공연장 이름
          example: "서울 올림픽 경기장"
        venueCity:
          type: string
          description: 공연장 도시
          example: "서울"
        seatNumber:
          type: integer
          description: 좌석 번호
          example: 1

    PaymentInfo:
      type: object
      required:
        - amount
        - status
        - paidAt
      properties:
        amount:
          type: number
          format: decimal
          description: 결제 금액
          example: 100000.00
        status:
          type: string
          description: 결제 상태
          example: "COMPLETED"
        paidAt:
          type: string
          description: 결제 시간
          example: "2025-09-06T10:03:00"

    UserInfo:
      type: object
      required:
        - userId
        - balanceBefore
        - balanceAfter
      properties:
        userId:
          type: string
          description: 사용자 ID
          example: "HIDEONBUSH"
        balanceBefore:
          type: number
          format: decimal
          description: 결제 전 잔액
          example: 150000.00
        balanceAfter:
          type: number
          format: decimal
          description: 결제 후 잔액
          example: 50000.00

    ReservationResponse:
      type: object
      required:
        - reservationId
        - concertInfo
        - venueInfo
        - seatInfo
        - holdExpiresAt
        - status
      properties:
        reservationId:
          type: string
          description: 예약 ID
          example: "RHIDE-103251790257"
        concertInfo:
          $ref: '#/components/schemas/ConcertInfo'
        venueInfo:
          $ref: '#/components/schemas/VenueInfo'
        seatInfo:
          $ref: '#/components/schemas/SeatInfo'
        holdExpiresAt:
          type: string
          description: 임시 배정 만료 시간
          example: "2025-09-07T19:05:00"
        status:
          type: string
          description: 예약 상태
          example: "HOLD"

    ConcertInfo:
      type: object
      required:
        - date
        - title
        - ticketPrice
      properties:
        date:
          type: string
          description: 콘서트 날짜
          example: "2025-09-07"
        title:
          type: string
          description: 콘서트 제목
          example: "우주개라이카"
        ticketPrice:
          type: number
          format: decimal
          description: 티켓 가격
          example: 89000.00

    SeatInfo:
      type: object
      required:
        - seatId
        - seatNumber
      properties:
        seatId:
          type: string
          description: 좌석 ID
          example: "1"
        seatNumber:
          type: integer
          description: 좌석 번호
          example: 1

    ReservationRequest:
      type: object
      required:
        - concertDate
        - concertTitle
        - seatId
      properties:
        concertDate:
          type: string
          description: 콘서트 날짜
          example: "2025-09-07"
        concertTitle:
          type: string
          description: 콘서트 제목
          example: "우주개라이카"
        seatId:
          type: string
          description: 좌석 ID
          example: "1"

    DatePerformanceResponse:
      type: object
      required:
        - date
        - performances
      properties:
        date:
          type: string
          format: date
          description: 조회한 날짜
          example: "2025-07-19"
        performances:
          type: array
          items:
            $ref: '#/components/schemas/DatePerformanceInfo'
          description: 해당 날짜의 공연 목록

    DatePerformanceInfo:
      type: object
      required:
        - performanceId
        - concertName
        - venueName
        - venueCity
        - performanceTime
        - ticketPrice
        - availableSeats
      properties:
        performanceId:
          type: string
          description: 공연 고유 식별자
          example: "PERF-001"
        concertName:
          type: string
          description: 콘서트 이름
          example: "우주개라이카"
        venueName:
          type: string
          description: 공연장 이름
          example: "서울 올림픽 경기장"
        venueCity:
          type: string
          description: 공연장 도시
          example: "서울"
        performanceTime:
          type: string
          description: 공연 시간
          example: "19:00"
        ticketPrice:
          type: number
          format: decimal
          description: 티켓 가격
          example: 150000.00
        availableSeats:
          type: integer
          description: 예약 가능한 좌석 수
          example: 45

    VenueResponse:
      type: object
      required:
        - venueId
        - venueName
        - venueAddress
        - venueCity
        - venueCapacity
        - venueDescription
        - isActive
      properties:
        venueId:
          type: string
          description: 공연장 고유 식별자
          example: "VENUE-001"
        venueName:
          type: string
          description: 공연장 이름
          example: "서울 올림픽 경기장"
        venueAddress:
          type: string
          description: 공연장 주소
          example: "서울 송파구 올림픽로 424"
        venueCity:
          type: string
          description: 공연장 도시
          example: "서울"
        venueCapacity:
          type: integer
          description: 공연장 수용 인원
          example: 10000
        venueDescription:
          type: string
          description: 공연장 설명
          example: "대규모 콘서트에 적합한 경기장"
        isActive:
          type: boolean
          description: 활성화 상태
          example: true

    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
        - timestamp
      properties:
        errorCode:
          type: string
          description: 오류 코드
          example: "INVALID_TOKEN"
        message:
          type: string
          description: 오류 메시지
          example: "유효하지 않은 토큰입니다."
        timestamp:
          type: string
          format: date-time
          description: 오류 발생 시간
          example: "2025-09-06T10:00:00"
        details:
          type: object
          description: 추가 오류 정보
          example:
            field: "tokenId"
            value: "invalid-token"

  securitySchemes:
    QueueTokenAuth:
      type: apiKey
      in: query
      name: tokenId
      description: 대기열 토큰을 통한 인증


