          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/concerts/seats/details:
    get:
      tags:
        - Concert
      summary: 콘서트 좌석 상세 정보 조회
      description: |
        특정 콘서트의 좌석 상세 정보를 조회합니다.
        각 좌석의 상태(예약가능, 임시배정, 판매완료)와 전체 좌석 현황을 제공합니다.
      operationId: getConcertSeatDetails
      parameters:
        - name: X-QUEUE-TOKEN
          in: header
          required: true
          description: 대기열 토큰 ID
          schema:
            type: string
            example: "THIDE-67890"
        - name: concertDate
          in: query
          required: true
          description: 콘서트 날짜 (yyyy-MM-dd)
          schema:
            type: string
            format: date
            example: "2025-09-07"
        - name: concertTitle
          in: query
          required: true
          description: 콘서트 제목
          schema:
            type: string
            example: "우주개라이카"
      responses:
        '200':
          description: 좌석 상세 정보 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcertSeatResponse'
        '400':
          description: 잘못된 요청 (존재하지 않는 콘서트)
          content:
            application/json:
