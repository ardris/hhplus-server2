  /api/v1/reservations:
    post:
      tags:
        - Reservation
      summary: 좌석 예약 요청
      description: |
        좌석을 예약하고 5분간 임시 배정합니다.
        임시 배정된 좌석은 다른 사용자가 예약할 수 없으며,
        5분 내에 결제를 완료해야 합니다.
      operationId: makeReservation
      parameters:
        - name: X-QUEUE-TOKEN
          in: header
          required: true
          description: 대기열 토큰 ID
          schema:
            type: string
            example: "THIDE-67890"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
      responses:
        '200':
          description: 예약 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          description: 잘못된 요청 (입력값 검증 실패, 일반적인 예약 오류)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "RESERVATION_ERROR"
                message: "콘서트 날짜는 필수입니다."
                timestamp: "2025-09-05T10:00:00Z"
        '401':
          description: 유효하지 않은 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "QUEUE_TOKEN_ERROR"
                message: "유효하지 않은 토큰입니다."
                timestamp: "2025-09-05T10:00:00Z"
        '410':
          description: 좌석이 존재하지 않거나 이미 판매됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "SEAT_NOT_FOUND"
                message: "존재하지 않는 좌석입니다."
                timestamp: "2025-09-05T10:00:00Z"
        '423':
          description: 좌석이 이미 임시 배정됨 (다른 사용자가 예약 중)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "SEAT_ALREADY_HELD"
                message: "이미 다른 사용자에게 임시배정된 좌석입니다."
                timestamp: "2025-09-05T10:00:00Z"
        '425':
          description: 대기열 비활성 상태 (아직 활성화되지 않음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "NOT_ACTIVE_IN_QUEUE"
                message: "아직 활성화되지 않았습니다. 잠시만 기다려 주세요. (대기 인원 : 5)"
                timestamp: "2025-09-05T10:00:00Z"
        '498':
          description: 유효하지 않은 토큰 (커스텀 토큰 오류)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "INVALID_TOKEN"
                message: "유효하지 않은 토큰입니다."
                timestamp: "2025-09-05T10:00:00Z"
        '499':
          description: 토큰 만료 (커스텀 토큰 만료)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "TOKEN_EXPIRED"
                message: "토큰이 만료되었습니다. 다시 발급받아 주세요."
                timestamp: "2025-09-05T10:00:00Z"
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
