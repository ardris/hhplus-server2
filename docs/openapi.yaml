openapi: 3.0.3
info:
  version : 1.0.0
  title: 콘서트 예약 서비스 API
  description: |
    콘서트 예약 서비스를 위한 RESTful API입니다.
    


tags:
  - name: Queue
    description: 대기열 관리
  - name: Concert
    description: 콘서트 정보 조회
  - name: Reservation
    description: 좌석 예약
  - name: Payment
    description: 결제 관리
  - name: User
    description: 사용자 관리

paths:
  /api/v1/queue/token:
    post:
      tags:
        - Queue
      summary: 대기열 토큰 발급
      description: |
        사용자가 서비스를 이용하기 위한 대기열 토큰을 발급합니다.
        기존에 유효한 토큰이 있는 경우 해당 토큰을 반환합니다.
      operationId: issueQueueToken
      parameters:
        - name: userId
          in: query
          required: true
          description: 사용자 고유 식별자
          schema:
            type: string
            example: "HIDEONBUSH"
      responses:
        '200':
          description: 토큰 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/queue/status:
    get:
      tags:
        - Queue
      summary: 대기열 상태 조회
      description: |
        사용자의 현재 대기열 상태를 조회합니다.
        대기 순서, 총 대기자 수, 남은 시간 등의 정보를 제공합니다.
      operationId: getQueueStatus
      parameters:
        - name: X-QUEUE-TOKEN
          in: header
          required: true
          description: 대기열 토큰 ID
          schema:
            type: string
            example: "THIDE-09876543"
      responses:
        '200':
          description: 대기열 상태 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatusResponse'
        '401':
          description: 유효하지 않은 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/concerts:
    get:
      tags:
        - Concert
      summary: 예약 가능한 콘서트 목록 조회
      description: |
        예약 가능한 콘서트 목록을 조회합니다.
        날짜 범위를 지정하여 특정 기간의 콘서트만 조회할 수 있습니다.
      operationId: getAvailableConcerts
      parameters:
        - name: X-QUEUE-TOKEN
          in: header
          required: true
          description: 대기열 토큰 ID
          schema:
            type: string
            example: "THIDE-67890"
        - name: startDate
          in: query
          required: false
          description: 조회 시작 날짜 (yyyy-MM-dd)
          schema:
            type: string
            format: date
            example: "2025-09-05"
        - name: endDate
          in: query
          required: false
          description: 조회 종료 날짜 (yyyy-MM-dd)
          schema:
            type: string
            format: date
            example: "2025-09-11"
      responses:
        '200':
          description: 콘서트 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  concerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConcertResponse'
                  totalCount:
                    type: integer
                    description: 총 콘서트 수
                    example: 5
              examples:
                multiple_concerts:
                  summary: 여러 콘서트 목록 (공연장 정보 포함)
                  value:
                    concerts:
                      - concertId: "RAIKASPACEDOG"
                        concertName: "우주개라이카"
                        concertPeriodStart: "2025-09-07"
                        concertPeriodEnd: "2025-09-10"
                        isActive: true
                        venues:
                          - venueId: "VENUE-001"
                            venueName: "서울 올림픽 경기장"
                            venueCity: "서울"
                            venueAddress: "서울 송파구 올림픽로 424"
                            venueCapacity: 10000
                            performances:
                              - performanceId: "PERF-001"
                                performanceDate: "2025-09-07"
                                performanceTime: "19:00"
                                ticketPrice: 89000.00
                                availableSeats: 45
                              - performanceId: "PERF-002"
                                performanceDate: "2025-09-08"
                                performanceTime: "19:00"
                                ticketPrice: 89000.00
                                availableSeats: 50
                          - venueId: "VENUE-002"
                            venueName: "부산 아시아드 주경기장"
                            venueCity: "부산"
                            venueAddress: "부산 연제구 월드컵대로 344"
                            venueCapacity: 5000
                            performances:
                              - performanceId: "PERF-003"
                                performanceDate: "2025-09-10"
                                performanceTime: "19:00"
                                ticketPrice: 89000.00
                                availableSeats: 48
                      - concertId: "WOMAN"
                        concertName: "미녀는괴로워"
                        concertPeriodStart: "2025-09-08"
                        concertPeriodEnd: "2025-09-08"
                        isActive: true
                        venues:
                          - venueId: "VENUE-003"
                            venueName: "대구 실내체육관"
                            venueCity: "대구"
                            venueAddress: "대구 북구 무태조야로 130"
                            venueCapacity: 3000
                            performances:
                              - performanceId: "PERF-004"
                                performanceDate: "2025-09-08"
                                performanceTime: "20:00"
                                ticketPrice: 120000.00
                                availableSeats: 45
                      - concertId: "HOME"
                        concertName: "집으로"
                        concertPeriodStart: "2025-09-08"
                        concertPeriodEnd: "2025-09-09"
                        isActive: true
                        venues:
                          - venueId: "VENUE-001"
                            venueName: "서울 올림픽 경기장"
                            venueCity: "서울"
                            venueAddress: "서울 송파구 올림픽로 424"
                            venueCapacity: 10000
                            performances:
                              - performanceId: "PERF-005"
                                performanceDate: "2025-09-08"
                                performanceTime: "18:00"
                                ticketPrice: 75000.00
                                availableSeats: 200
                              - performanceId: "PERF-006"
                                performanceDate: "2025-09-09"
                                performanceTime: "18:00"
                                ticketPrice: 75000.00
                                availableSeats: 180
                    totalCount: 3
                single_concert:
                  summary: 단일 콘서트
                  value:
                    concerts:
                      - concertId: "RAIKASPACEDOG"
                        concertName: "우주개라이카"
                        concertPeriodStart: "2025-09-07"
                        concertPeriodEnd: "2025-09-10"
                        isActive: true
                        venues:
                          - venueId: "VENUE-001"
                            venueName: "서울 올림픽 경기장"
                            venueCity: "서울"
                            venueAddress: "서울 송파구 올림픽로 424"
                            venueCapacity: 10000
                            performances:
                              - performanceId: "PERF-001"
                                performanceDate: "2025-09-07"
                                performanceTime: "19:00"
                                ticketPrice: 89000.00
                                availableSeats: 45
                    totalCount: 1
                inactive_concert:
                  summary: 비활성 콘서트 포함
                  value:
                    concerts:
                      - concertId: "SUMMER2025"
                        concertName: "여름밤 콘서트"
                        concertDate: "2025-07-20"
                        totalSeatCount: 150
                        ticketPrice: 95000.00
                        isActive: false
                    totalCount: 1                    
        '401':
          description: 유효하지 않은 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/concerts/dates:
    get:
      tags:
        - Concert
      summary: 예약 가능한 콘서트 날짜 목록 조회
      description: |
        예약 가능한 콘서트가 있는 날짜 목록을 조회합니다.
        날짜만 필요한 경우 사용하는 간소화된 API입니다. 개선되어 삭제될 예정입니다.
      operationId: getAvailableConcertDates
      parameters:
        - name: X-QUEUE-TOKEN
          in: header
          required: true
          description: 대기열 토큰 ID
          schema:
            type: string
            example: "THIDE-67890"
      responses:
        '200':
          description: 콘서트 날짜 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  dates:
                    type: array
                    items:
                      type: string
                      format: date
                      example: "2025-09-07"
                  totalCount:
                    type: integer
                    description: 총 날짜 수
                    example: 10
        '401':
          description: 유효하지 않은 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/performances/date/{date}:
    get:
      tags:
        - Concert
      summary: 특정 날짜의 모든 공연 조회
      description: |
        특정 날짜에 있는 모든 공연을 조회합니다.
        여러 공연장에서 동시에 열리는 공연 정보를 포함하여 제공합니다.
        공연장 정보, 콘서트 정보, 예약 가능한 좌석 수 등을 확인할 수 있습니다.
      operationId: getPerformancesByDate
      parameters:
        - name: X-QUEUE-TOKEN
          in: header
          required: true
          description: 대기열 토큰 ID
          schema:
            type: string
            example: "THIDE-67890"
        - name: date
          in: path
          required: true
          description: 조회할 날짜 (yyyy-MM-dd)
          schema:
            type: string
            format: date
            example: "2025-07-19"
      responses:
        '200':
          description: 날짜별 공연 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatePerformanceResponse'
              examples:
                multiple_performances:
                  summary: 여러 공연장의 공연
                  value:
                    date: "2025-07-19"
                    performances:
                      - performanceId: "PERF-001"
                        concertName: "BTS 콘서트"
                        venueName: "서울 올림픽 경기장"
                        venueCity: "서울"
                        performanceTime: "19:00"
                        ticketPrice: 150000.00
                        availableSeats: 45
                      - performanceId: "PERF-003"
                        concertName: "아이유 콘서트"
                        venueName: "대구 실내체육관"
                        venueCity: "대구"
                        performanceTime: "20:00"
                        ticketPrice: 120000.00
                        availableSeats: 45
                single_performance:
                  summary: 단일 공연
                  value:
                    date: "2025-07-20"
                    performances:
                      - performanceId: "PERF-002"
                        concertName: "BTS 콘서트"
                        venueName: "부산 아시아드 주경기장"
                        venueCity: "부산"
                        performanceTime: "19:00"
                        ticketPrice: 150000.00
                        availableSeats: 50
                no_performances:
                  summary: 공연 없음
                  value:
                    date: "2025-07-21"
                    performances: []
        '400':
          description: 잘못된 날짜 형식
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "INVALID_DATE_FORMAT"
                message: "날짜 형식이 올바르지 않습니다. yyyy-MM-dd 형식을 사용해주세요."
                timestamp: "2025-09-05T10:00:00Z"
        '401':
          description: 유효하지 않은 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/venues:
    get:
      tags:
        - Concert
      summary: 공연장 목록 조회
      description: |
        공연장 목록을 조회합니다.
        날짜 범위를 지정하면 해당 기간에 공연이 있는 공연장만 조회됩니다.
        활성화된 공연장만 조회하거나 전체 공연장을 조회할 수 있습니다.
      operationId: getVenues
      parameters:
        - name: X-QUEUE-TOKEN
          in: header
          required: true
          description: 대기열 토큰 ID
          schema:
            type: string
            example: "THIDE-67890"
        - name: startDate
          in: query
          required: false
          description: 조회 시작 날짜 (yyyy-MM-dd) - 해당 날짜부터 공연이 있는 공연장만 조회
          schema:
            type: string
            format: date
            example: "2025-07-19"
        - name: endDate
          in: query
          required: false
          description: 조회 종료 날짜 (yyyy-MM-dd) - 해당 날짜까지 공연이 있는 공연장만 조회
          schema:
            type: string
            format: date
            example: "2025-07-25"
        - name: activeOnly
          in: query
          required: false
          description: 활성화된 공연장만 조회 여부
          schema:
            type: boolean
            default: true
            example: true
      responses:
        '200':
          description: 공연장 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items:
                      $ref: '#/components/schemas/VenueResponse'
                  totalCount:
                    type: integer
                    description: 총 공연장 수
                    example: 3
              examples:
                all_venues:
                  summary: 모든 공연장
                  value:
                    venues:
                      - venueId: "VENUE-001"
                        venueName: "서울 올림픽 경기장"
                        venueAddress: "서울 송파구 올림픽로 424"
                        venueCity: "서울"
                        venueCapacity: 10000
                        venueDescription: "대규모 콘서트에 적합한 경기장"
                        isActive: true
                      - venueId: "VENUE-002"
                        venueName: "부산 아시아드 주경기장"
                        venueAddress: "부산 연제구 월드컵대로 344"
                        venueCity: "부산"
                        venueCapacity: 5000
                        venueDescription: "부산의 대표적인 야외 공연장"
                        isActive: true
                      - venueId: "VENUE-003"
                        venueName: "대구 실내체육관"
                        venueAddress: "대구 북구 무태조야로 130"
                        venueCity: "대구"
                        venueCapacity: 3000
                        venueDescription: "실내 공연에 최적화된 체육관"
                        isActive: true
                    totalCount: 3
                venues_with_performances:
                  summary: 특정 기간에 공연이 있는 공연장
                  value:
                    venues:
                      - venueId: "VENUE-001"
                        venueName: "서울 올림픽 경기장"
                        venueAddress: "서울 송파구 올림픽로 424"
                        venueCity: "서울"
                        venueCapacity: 10000
                        venueDescription: "대규모 콘서트에 적합한 경기장"
                        isActive: true
                      - venueId: "VENUE-003"
                        venueName: "대구 실내체육관"
                        venueAddress: "대구 북구 무태조야로 130"
                        venueCity: "대구"
                        venueCapacity: 3000
                        venueDescription: "실내 공연에 최적화된 체육관"
                        isActive: true
                    totalCount: 2
        '401':
          description: 유효하지 않은 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/venues/{venueId}:
    get:
      tags:
        - Concert
      summary: 공연장 상세 정보 조회
      description: |
        특정 공연장의 상세 정보를 조회합니다.
        공연장의 기본 정보와 수용 인원, 주소 등을 확인할 수 있습니다.
      operationId: getVenueById
      parameters:
        - name: X-QUEUE-TOKEN
          in: header
          required: true
          description: 대기열 토큰 ID
          schema:
            type: string
            example: "THIDE-67890"
        - name: venueId
          in: path
          required: true
          description: 공연장 고유 식별자
          schema:
            type: string
            example: "VENUE-001"
      responses:
        '200':
          description: 공연장 상세 정보 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueResponse'
              examples:
                seoul_olympic:
                  summary: 서울 올림픽 경기장
                  value:
                    venueId: "VENUE-001"
                    venueName: "서울 올림픽 경기장"
                    venueAddress: "서울 송파구 올림픽로 424"
                    venueCity: "서울"
                    venueCapacity: 10000
                    venueDescription: "대규모 콘서트에 적합한 경기장"
                    isActive: true
        '404':
          description: 공연장을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "VENUE_NOT_FOUND"
                message: "해당 공연장을 찾을 수 없습니다."
                timestamp: "2025-09-05T10:00:00Z"
        '401':
          description: 유효하지 않은 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/venues/city/{city}:
    get:
      tags:
        - Concert
      summary: 도시별 공연장 조회
      description: |
        특정 도시의 공연장 목록을 조회합니다.
        도시명으로 해당 지역의 모든 공연장을 확인할 수 있습니다.
      operationId: getVenuesByCity
      parameters:
        - name: X-QUEUE-TOKEN
          in: header
          required: true
          description: 대기열 토큰 ID
          schema:
            type: string
            example: "THIDE-67890"
        - name: city
          in: path
          required: true
          description: 도시명
          schema:
            type: string
            example: "서울"
      responses:
        '200':
          description: 도시별 공연장 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                    description: 조회한 도시명
                    example: "서울"
                  venues:
                    type: array
                    items:
                      $ref: '#/components/schemas/VenueResponse'
                  totalCount:
                    type: integer
                    description: 해당 도시의 공연장 수
                    example: 1
              examples:
                seoul_venues:
                  summary: 서울 공연장
                  value:
                    city: "서울"
                    venues:
                      - venueId: "VENUE-001"
                        venueName: "서울 올림픽 경기장"
                        venueAddress: "서울 송파구 올림픽로 424"
                        venueCity: "서울"
                        venueCapacity: 10000
                        venueDescription: "대규모 콘서트에 적합한 경기장"
                        isActive: true
                    totalCount: 1
                busan_venues:
                  summary: 부산 공연장
                  value:
                    city: "부산"
                    venues:
                      - venueId: "VENUE-002"
                        venueName: "부산 아시아드 주경기장"
                        venueAddress: "부산 연제구 월드컵대로 344"
                        venueCity: "부산"
                        venueCapacity: 5000
